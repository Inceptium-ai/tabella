[project]
name = "udap-cli"
version = "0.1.0"
description = "The `udap` CLI: register, discover, validate, serve, tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = [
    "udap-core",
    "udap-connectors",
    "udap-enable",
    "uvicorn>=0.30",
]

[project.scripts]
udap = "udap_cli.cli:main"

[tool.uv.sources]
udap-core = { workspace = true }
udap-connectors = { workspace = true }
udap-enable = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udap_cli"]
