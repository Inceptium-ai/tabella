[project]
name = "tabella-catalog-om"
version = "0.1.0"
description = "Tabella catalog backend for OpenMetadata (M1)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = ["tabella-core"]

[tool.uv.sources]
tabella-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabella_catalog_om"]
