[project]
name = "udap-governance-aws"
version = "0.1.0"
description = "UDAP governance backend for AWS Glue + Lake Formation (M3)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = ["udap-core"]

[tool.uv.sources]
udap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udap_governance_aws"]
