[project]
name = "tabella-enable"
version = "0.1.1"
description = "Tabella AI-enablement: generated REST access layers, MCP tools + live MCP server, RAG vectorization and semantic search"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tabella-core",
    "fastapi>=0.111",
    "httpx>=0.27",
    "mcp>=1.2",
]

[tool.uv.sources]
tabella-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/Inceptium-ai/tabella"
Repository = "https://github.com/Inceptium-ai/tabella"
Issues = "https://github.com/Inceptium-ai/tabella/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabella_enable"]
