[project]
name = "tabella-enable"
version = "0.1.0"
description = "Tabella AI-enablement generators: REST access layer, MCP tool manifest (RAG + live MCP server in M2)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = [
    "tabella-core",
    "fastapi>=0.111",
    "httpx>=0.27",
    "mcp>=1.2",
]

[tool.uv.sources]
tabella-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabella_enable"]
