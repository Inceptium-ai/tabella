[project]
name = "tabella-governance-aws"
version = "0.1.0"
description = "Tabella governance backend for AWS Glue + Lake Formation (M3)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = ["tabella-core"]

[tool.uv.sources]
tabella-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabella_governance_aws"]
