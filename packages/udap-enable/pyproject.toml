[project]
name = "udap-enable"
version = "0.1.0"
description = "UDAP AI-enablement generators: REST access layer, MCP tool manifest (RAG + live MCP server in M2)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = [
    "udap-core",
    "fastapi>=0.111",
]

[tool.uv.sources]
udap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udap_enable"]
