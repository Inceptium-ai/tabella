[project]
name = "tabella-cli"
version = "0.1.3"
description = "The `tabella` CLI: register, discover, validate, serve, tools, vectorize, mcp"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tabella-core",
    "tabella-connectors",
    "tabella-catalog-om",
    "tabella-governance-aws",
    "tabella-enable",
    "uvicorn>=0.30",
]

[project.scripts]
tabella = "tabella_cli.cli:main"

[tool.uv.sources]
tabella-core = { workspace = true }
tabella-connectors = { workspace = true }
tabella-catalog-om = { workspace = true }
tabella-governance-aws = { workspace = true }
tabella-enable = { workspace = true }

[project.urls]
Homepage = "https://github.com/Inceptium-ai/tabella"
Repository = "https://github.com/Inceptium-ai/tabella"
Issues = "https://github.com/Inceptium-ai/tabella/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabella_cli"]
