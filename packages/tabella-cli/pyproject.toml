[project]
name = "tabella-cli"
version = "0.1.0"
description = "The `tabella` CLI: register, discover, validate, serve, tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yazdan Ahmed" }]
dependencies = [
    "tabella-core",
    "tabella-connectors",
    "tabella-catalog-om",
    "tabella-enable",
    "uvicorn>=0.30",
]

[project.scripts]
tabella = "tabella_cli.cli:main"

[tool.uv.sources]
tabella-core = { workspace = true }
tabella-connectors = { workspace = true }
tabella-catalog-om = { workspace = true }
tabella-enable = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabella_cli"]
